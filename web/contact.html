<body data-page="contact" data-root="" data-crumbs='[["Contact","contact.html"]]'>
<main><section class="hero" style="min-height:auto;padding-block:150px 70px"><div class="mesh"><div class="blob" style="width:340px;height:340px;background:#BFD3FF;right:8%;top:10%"></div><div class="blob" style="width:300px;height:300px;background:#DCCBFF;left:2%;top:30%;animation-delay:-5s"></div></div>
<div class="wrap" style="display:block"><div data-mount="crumbs"></div><p class="eyebrow">Contact and partnerships</p><h1 class="xl split" style="margin-top:20px;font-size:clamp(40px,7vw,100px)">Let's <span class='grad'>connect.</span></h1><p class="lede">Businesses, sellers, restaurants, logistics providers, technology providers and prospective partners are welcome to start a conversation.</p></div></section>
<section class="sec" style="padding-top:0"><div class="wrap"><div class="contactgrid"><div><p class="eyebrow">Enquiry type</p><div class="cats"><button type="button" data-cat="General corporate enquiry" aria-pressed="false">General corporate enquiry<span>→</span></button><button type="button" data-cat="Business partnership" aria-pressed="false">Business partnership<span>→</span></button><button type="button" data-cat="Technology partnership" aria-pressed="false">Technology partnership<span>→</span></button><button type="button" data-cat="Seller or merchant enquiry" aria-pressed="false">Seller or merchant enquiry<span>→</span></button><button type="button" data-cat="Careers" aria-pressed="false">Careers<span>→</span></button><button type="button" data-cat="Other enquiries" aria-pressed="false">Other enquiries<span>→</span></button></div>
<div style="margin-top:36px"><p class="eyebrow">Registered office</p><dl class="kv" data-mount="corp"></dl><p class="slate" style="margin-top:14px;font-size:14px">Official email: to be supplied.</p></div></div>
<div class="formcard"><form data-form="contact" novalidate><div class="two"><div class="f"><label for="f-name">Name</label><input id="f-name" name="name" autocomplete="name" required maxlength="80"><div class="err"></div></div><div class="f"><label for="f-email">Work email</label><input id="f-email" name="email" type="email" autocomplete="email" required maxlength="120"><div class="err"></div></div></div>
<div class="two"><div class="f"><label for="f-org">Company (optional)</label><input id="f-org" name="org" autocomplete="organization" maxlength="120"><div class="err"></div></div><div class="f"><label for="f-cat">Enquiry type</label><select id="f-cat" name="category" required><option value="">Select a type</option><option>General corporate enquiry</option><option>Business partnership</option><option>Technology partnership</option><option>Seller or merchant enquiry</option><option>Careers</option><option>Other enquiries</option></select><div class="err"></div></div></div>
<div class="f"><label for="f-msg">Message</label><textarea id="f-msg" name="message" required maxlength="1500"></textarea><div class="err"></div></div><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><div class="fstat" role="status" aria-live="polite"></div>
<button class="btn primary" type="submit" style="justify-self:start">Send message <span class="spin2"></span></button></form></div></div></div></section></main>
